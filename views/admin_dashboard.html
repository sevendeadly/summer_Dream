<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <title>RSVP Admin Dashboard</title>
    <style>
        .admin-toast-stack {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-width: min(360px, calc(100vw - 2rem));
            pointer-events: none;
        }
        .admin-toast {
            pointer-events: auto;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            padding: 0.85rem 1rem;
            display: flex;
            align-items: flex-start;
            gap: 0.65rem;
            opacity: 0;
            transform: translateY(-8px);
            transition: opacity 0.25s ease, transform 0.25s ease;
            border-left: 4px solid #28a745;
        }
        .admin-toast--error { border-left-color: #dc3545; }
        .admin-toast--visible { opacity: 1; transform: translateY(0); }
        .admin-toast__icon { flex-shrink: 0; width: 28px; height: 28px; margin-top: 2px; }
        .admin-toast__text { font-size: 0.9rem; line-height: 1.4; color: #333; }
        .admin-check-ring {
            stroke: #28a745;
            stroke-width: 2.5;
            fill: none;
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            animation: admin-check-ring-draw 0.45s ease forwards;
        }
        .admin-check-mark {
            stroke: #28a745;
            stroke-width: 2.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 24;
            stroke-dashoffset: 24;
            animation: admin-check-mark-draw 0.35s 0.35s ease forwards;
        }
        @keyframes admin-check-ring-draw { to { stroke-dashoffset: 0; } }
        @keyframes admin-check-mark-draw { to { stroke-dashoffset: 0; } }

        .admin-modal-root[hidden] { display: none !important; }
        .admin-modal-root {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .admin-modal-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.45);
        }
        .admin-modal-card {
            position: relative;
            background: #fff;
            border-radius: 12px;
            max-width: 420px;
            width: 100%;
            padding: 1.35rem 1.5rem;
            box-shadow: 0 16px 48px rgba(0,0,0,0.2);
            animation: admin-modal-pop 0.22s ease;
        }
        @keyframes admin-modal-pop {
            from { opacity: 0; transform: scale(0.96) translateY(6px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .admin-modal-card h2 { margin: 0 0 0.5rem; font-size: 1.15rem; color: #333; }
        .admin-modal-card p { margin: 0 0 1rem; color: #555; font-size: 0.95rem; line-height: 1.45; }
        .admin-modal-card textarea {
            width: 100%;
            min-height: 88px;
            margin-bottom: 1rem;
            padding: 0.6rem;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.9rem;
            resize: vertical;
        }
        .admin-modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; flex-wrap: wrap; }
        .admin-modal-actions button {
            padding: 0.45rem 1rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .admin-modal-btn-secondary { background: #e9ecef; color: #333; }
        .admin-modal-btn-primary { background: var(--primary-color, #d4a5a5); color: #fff; }
        .admin-modal-btn-danger { background: #dc3545; color: #fff; }
        .admin-success-check-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 0.5rem 0;
        }
        .admin-success-check-wrap svg { width: 72px; height: 72px; margin-bottom: 0.75rem; }
        .admin-success-check-wrap p { margin: 0; color: #555; font-size: 0.95rem; }
        .admin-success-check-wrap .admin-check-ring {
            stroke-dasharray: 140;
            stroke-dashoffset: 140;
        }
        .admin-success-check-wrap .admin-check-mark {
            stroke-dasharray: 60;
            stroke-dashoffset: 60;
        }
    </style>
</head>
<body class="admin-page">
    <nav class="navbar">
        <div class="nav-container">
            <ul class="nav-menu">
                <li><a href="../index.html">Home</a></li>
                <li><a href="info.html">Wedding Info</a></li>
                <li><a href="gift.html">Gift Pot</a></li>
                <li><a href="rsvp.html">RSVP</a></li>
                <li><a href="albums.html">Albums</a></li>
            </ul>
            <a href="admin_dashboard.html" class="admin-btn active" aria-label="Admin Dashboard" title="Admin Dashboard"><span>👤</span></a>
        </div>
    </nav>

    <!-- Login section (shown when not authenticated) -->
    <section id="login-section" class="admin-auth">
        <h2 style="color: var(--primary-color); text-align: center; margin-bottom: 20px;">Admin Login</h2>
        <input type="password" id="admin-secret" placeholder="Enter admin secret">
        <button id="login-btn">Login</button>
        <p style="color: #dc3545; margin-top: 15px; display: none;" id="auth-error">Invalid secret</p>
    </section>

    <!-- Dashboard section (hidden until authenticated) -->
    <section id="dashboard-section" style="display:none;">
        <div class="container">
            <div class="header">
                <h1>RSVP Admin Dashboard</h1>
                <p>Manage wedding RSVPs and send confirmations</p>
                <div class="btn-delete" style="text-align: right; margin-top: 8px;">
                    <button id="logout-btn" >Logout</button>
                </div>
            </div>

            <div class="admin-stats">
                <div class="stat-card">
                    <h3>Total RSVPs</h3>
                    <div class="number" id="stats-total">0</div>
                </div>
                <div class="stat-card" style="display: none;">
                    <h3>Attending</h3>
                    <div class="number" id="stats-attending">0</div>
                </div>
                <div class="stat-card">
                    <h3>Pending Review</h3>
                    <div class="number" id="stats-pending">0</div>
                </div>
                <div class="stat-card">
                    <h3>Approved Attending Guests</h3>
                    <div class="number" id="stats-approved-guests">0</div>
                </div>
            </div>

            <div class="filters-bar">
                <select id="filter-status">
                    <option value="">All Status</option>
                    <option value="pending">Pending</option>
                    <option value="approved">Approved</option>
                    <option value="declined">Declined</option>
                </select>
                <select id="filter-attending">
                    <option value="">All Responses</option>
                    <option value="yes">Attending</option>
                    <option value="no">Not Attending</option>
                </select>
                <input type="text" id="search-input" placeholder="Search by name or email">
                <select id="rows-per-page" style="margin-left: auto;">
                    <option value="25" selected>25 rows</option>
                    <option value="50">50 rows</option>
                    <option value="100">100 rows</option>
                </select>
            </div>

            <div id="rsvp-table" class="rsvp-list">
                <!-- Table injected by controllers/admin.js -->
                <div style="padding: 40px; text-align: center; color: #999;">Loading RSVPs...</div>
            </div>

            <div id="pagination-controls" class="pagination-controls"></div>
        </div>
    </section>

    <div id="admin-toast-stack" class="admin-toast-stack" aria-live="polite"></div>

    <div id="admin-modal-root" class="admin-modal-root" hidden>
        <div class="admin-modal-backdrop" data-admin-modal-dismiss="true"></div>
        <div class="admin-modal-card" role="dialog" aria-modal="true" aria-labelledby="admin-modal-title">
            <h2 id="admin-modal-title"></h2>
            <p id="admin-modal-message"></p>
            <textarea id="admin-modal-textarea" style="display:none;" placeholder=""></textarea>
            <div id="admin-modal-success" style="display:none;"></div>
            <div class="admin-modal-actions" id="admin-modal-actions">
                <button type="button" class="admin-modal-btn-secondary" id="admin-modal-cancel">Cancel</button>
                <button type="button" class="admin-modal-btn-primary" id="admin-modal-confirm">OK</button>
            </div>
        </div>
    </div>

    <!-- Import Admin Controller -->
    <script type="module" src="../controllers/admin.js"></script>
</body>
</html>
